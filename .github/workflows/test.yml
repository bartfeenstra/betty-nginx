name: Test

on:
  schedule:
    - cron: '12 * * * *'
  pull_request:
  push:
    branches:
      - '[0-9].[0-9].x'
    tags:
      - '*'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The number of builds that submit code coverage configured here MUST be identical
          # to the number of `after_n_builds` in ./codecov.yml.
          - name: 'Python 3.14'
            os: ubuntu-latest
            python: '3.14'
          - name: 'Python 3.13'
            os: ubuntu-latest
            python: '3.13'
          - name: 'macOS'
            os: macos-latest
            python: '3.14'
          - name: 'Windows'
            os: windows-latest
            python: '3.14'
    timeout-minutes: 60
    steps:
      - name: Check out the source code
        uses: actions/checkout@v6

      - name: Get the pip cache directory
        run: echo "pip_cache_dir=$(pip cache dir)" >> $GITHUB_ENV
        shell: bash

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ${{ env.pip_cache_dir }}
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('./pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python }}-

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Lua
        if: startsWith(runner.os, 'Linux')
        uses: leafo/gh-actions-lua@v13

      - name: Install LuaRocks
        if: startsWith(runner.os, 'Linux')
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua dependencies
        if: startsWith(runner.os, 'Linux')
        run: luarocks install busted

      - name: Build the development environment
        run: ./bin/build-ci.py

      - name: Run the tests
        if: startsWith(runner.os, 'Linux')
        run: ./bin/test.py

      - name: Run the tests
        if: ${{ ! startsWith(runner.os, 'Linux') }}
        run: ./bin/test.py
        env:
          BETTY_NGINX_TEST_SKIP_BUSTED: true

      - name: Upload code coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
